name: PhotoApp
options:
  bundleIdPrefix: com.photoapp
  deploymentTarget:
    macOS: "14.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

targets:
  PhotoApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Licences for GRDB and the depth model, shipped inside the app (generated by hand from their LICENSE files; see docs/RELEASE.md).
      - path: ThirdPartyNotices.md
        buildPhase: resources
      # The optional depth model (scripts/fetch_depth_model.sh). Absent on a fresh checkout: the build still works and the Depth Range mask
      # offers only embedded iPhone depth. Xcode compiles the .mlpackage into the bundle as DepthAnythingV2SmallF16.mlmodelc.
      - path: Models
        optional: true
    settings:
      base:
        COREML_CODEGEN_LANGUAGE: None # the app loads the compiled model dynamically; no generated class
        PRODUCT_NAME: PhotoApp
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Sources/App/Assets.xcassets (placeholder art from scripts/make_app_icon.swift)
        MARKETING_VERSION: "1.1.0" # CFBundleShortVersionString — bump per release
        CURRENT_PROJECT_VERSION: "2" # CFBundleVersion — must increase with every notarized/uploaded build
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Lightbench # the product name people see (menu bar, Finder, prompts). Module / bundle id stay PhotoApp: see Sources/App/AppInfo.swift
        CFBundleName: Lightbench
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        LSMinimumSystemVersion: "14.0"
        # Lets Finder offer Lightbench in "Open With" and the Dock accept photos and folders — as an ALTERNATE handler, so it never takes
        # over as the default app for anyone's images.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image, public.camera-raw-image]
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Praween Siritanasak"
        # Opts out of the system "Liquid Glass" restyling that the macOS 26+ SDK applies to toolbars and controls (the user confirmed the
        # flatter look by eye on 2026-10-08). Apple has called this key temporary. If it stops working, the app's own pieces keep PART of
        # the look: the solid `Theme` panels, `withoutToolbarBackground()` on the Library toolbar items and the custom window buttons;
        # other system controls would take the new style.
        UIDesignRequiresCompatibility: true
    entitlements:
      path: Sources/App/PhotoApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - package: GRDB

  PhotoAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PhotoApp

schemes:
  PhotoApp:
    build:
      targets:
        PhotoApp: all
        PhotoAppTests: [test]
    test:
      targets:
        - PhotoAppTests
    run:
      config: Debug
